<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store - Shopping Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
 
</head>

<body class="flex flex-col min-h-screen font-sans antialiased bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-50 bg-white border-b border-slate-200">
    <div class="container flex items-center justify-between h-16 gap-4 px-4 mx-auto">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold tracking-tight text-slate-900 shrink-0">
        <svg class="w-6 h-6 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
        <span>Store</span>
      </a>

      <nav class="flex items-center gap-5 text-sm font-medium shrink-0">
        <a href="index.html" class="transition text-slate-600 hover:text-teal-700">Home</a>
        <a href="wishlist.html" class="text-slate-600 hover:text-teal-700 transition flex items-center gap-1.5">
          <span>Wishlist</span>
          <span id="wishlist-count"
            class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">2</span>
        </a>
        <a href="cart.html"
          class="text-teal-700 font-semibold hover:text-teal-800 transition flex items-center gap-1.5">
          <span>Cart</span>
          <span id="cart-count"
            class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">3</span>
        </a>
      </nav>

    </div>
  </header>

  <main class="container flex-grow max-w-5xl px-4 py-8 mx-auto">
    <h1 class="mb-6 text-2xl font-bold sm:text-3xl text-slate-900">Shopping Cart</h1>

    <div id="cart-container">

      <div class="grid items-start grid-cols-1 gap-8 lg:grid-cols-3">

        <div
          class="overflow-hidden bg-white border divide-y rounded-lg shadow-sm lg:col-span-2 border-slate-200 divide-slate-200">

          <div class="flex flex-col items-center justify-between gap-4 p-4 sm:p-6 sm:flex-row sm:gap-6">
            <div class="flex items-center flex-1 w-full min-w-0 gap-4 sm:w-auto">
              <div
                class="w-16 h-16 sm:w-20 sm:h-20 bg-white border border-slate-200 rounded p-1.5 flex items-center justify-center shrink-0">
                <img src="https://cdn.dummyjson.com/product-images/beauty/essence-mascara-lash-princess/thumbnail.webp"
                  alt="Essence Mascara Lash Princess" class="object-contain max-w-full max-h-full">
              </div>
              <div class="flex-1 min-w-0">
                <a href="product-details.html"
                  class="text-sm font-semibold transition text-slate-900 hover:text-teal-700 line-clamp-2"
                  title="Essence Mascara Lash Princess">
                  Essence Mascara Lash Princess
                </a>
                <p class="mt-1 text-xs text-slate-500">₹9.99 each</p>
              </div>
            </div>
            <div class="flex items-center justify-between w-full gap-4 sm:justify-end sm:gap-6 sm:w-auto shrink-0">
              <div class="flex items-center bg-white border rounded border-slate-300">
                <button type="button"
                  class="cart-qty-minus p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-l transition"
                  aria-label="Decrease quantity">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                  </svg>
                </button>
                <span class="w-8 text-xs font-semibold text-center select-none text-slate-800">1</span>
                <button type="button"
                  class="cart-qty-plus p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-r transition"
                  aria-label="Increase quantity">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </button>
              </div>
              <div class="w-20 text-right">
                <span class="text-sm font-bold text-slate-900">₹9.99</span>
              </div>
              <button type="button"
                class="cart-wishlist-btn text-slate-400 hover:text-teal-700 p-1.5 rounded transition"
                title="Add to Wishlist" aria-label="Add to Wishlist">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                  </path>
                </svg>
              </button>
              <button type="button" class="cart-remove-btn text-slate-400 hover:text-red-600 p-1.5 rounded transition"
                title="Remove from cart" aria-label="Remove item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                  </path>
                </svg>
              </button>
            </div>
          </div>

          <div class="flex flex-col items-center justify-between gap-4 p-4 sm:p-6 sm:flex-row sm:gap-6">
            <div class="flex items-center flex-1 w-full min-w-0 gap-4 sm:w-auto">
              <div
                class="w-16 h-16 sm:w-20 sm:h-20 bg-white border border-slate-200 rounded p-1.5 flex items-center justify-center shrink-0">
                <img src="https://cdn.dummyjson.com/product-images/fragrances/calvin-klein-ck-one/thumbnail.webp"
                  alt="Calvin Klein CK One" class="object-contain max-w-full max-h-full">
              </div>
              <div class="flex-1 min-w-0">
                <a href="product-details.html"
                  class="text-sm font-semibold transition text-slate-900 hover:text-teal-700 line-clamp-2"
                  title="Calvin Klein CK One">
                  Calvin Klein CK One
                </a>
                <p class="mt-1 text-xs text-slate-500">₹49.99 each</p>
              </div>
            </div>
            <div class="flex items-center justify-between w-full gap-4 sm:justify-end sm:gap-6 sm:w-auto shrink-0">
              <div class="flex items-center bg-white border rounded border-slate-300">
                <button type="button"
                  class="cart-qty-minus p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-l transition"
                  aria-label="Decrease quantity">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                  </svg>
                </button>
                <span class="w-8 text-xs font-semibold text-center select-none text-slate-800">1</span>
                <button type="button"
                  class="cart-qty-plus p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-r transition"
                  aria-label="Increase quantity">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </button>
              </div>
              <div class="w-20 text-right">
                <span class="text-sm font-bold text-slate-900">₹49.99</span>
              </div>
              <button type="button"
                class="cart-wishlist-btn text-slate-400 hover:text-teal-700 p-1.5 rounded transition"
                title="Add to Wishlist" aria-label="Add to Wishlist">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                  </path>
                </svg>
              </button>
              <button type="button" class="cart-remove-btn text-slate-400 hover:text-red-600 p-1.5 rounded transition"
                title="Remove from cart" aria-label="Remove item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                  </path>
                </svg>
              </button>
            </div>
          </div>

          <div class="flex flex-col items-center justify-between gap-4 p-4 sm:p-6 sm:flex-row sm:gap-6">
            <div class="flex items-center flex-1 w-full min-w-0 gap-4 sm:w-auto">
              <div
                class="w-16 h-16 sm:w-20 sm:h-20 bg-white border border-slate-200 rounded p-1.5 flex items-center justify-center shrink-0">
                <img src="https://cdn.dummyjson.com/product-images/mens-shirts/blue-&-black-check-shirt/thumbnail.webp"
                  alt="Blue & Black Check Shirt" class="object-contain max-w-full max-h-full">
              </div>
              <div class="flex-1 min-w-0">
                <a href="product-details.html"
                  class="text-sm font-semibold transition text-slate-900 hover:text-teal-700 line-clamp-2"
                  title="Blue & Black Check Shirt">
                  Blue & Black Check Shirt
                </a>
                <p class="mt-1 text-xs text-slate-500">₹29.99 each</p>
              </div>
            </div>
            <div class="flex items-center justify-between w-full gap-4 sm:justify-end sm:gap-6 sm:w-auto shrink-0">
              <div class="flex items-center bg-white border rounded border-slate-300">
                <button type="button"
                  class="cart-qty-minus p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-l transition"
                  aria-label="Decrease quantity">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                  </svg>
                </button>
                <span class="w-8 text-xs font-semibold text-center select-none text-slate-800">1</span>
                <button type="button"
                  class="cart-qty-plus p-1.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-r transition"
                  aria-label="Increase quantity">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                </button>
              </div>
              <div class="w-20 text-right">
                <span class="text-sm font-bold text-slate-900">₹29.99</span>
              </div>
              <button type="button"
                class="cart-wishlist-btn text-slate-400 hover:text-teal-700 p-1.5 rounded transition"
                title="Add to Wishlist" aria-label="Add to Wishlist">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                  </path>
                </svg>
              </button>
              <button type="button" class="cart-remove-btn text-slate-400 hover:text-red-600 p-1.5 rounded transition"
                title="Remove from cart" aria-label="Remove item">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                  </path>
                </svg>
              </button>
            </div>
          </div>

        </div>

        <div class="sticky p-6 bg-white border rounded-lg shadow-sm border-slate-200 top-24">
          <h2 class="pb-3 mb-4 text-lg font-bold border-b text-slate-900 border-slate-200">
            Order Summary
          </h2>

          <div class="flex items-center justify-between mb-6 text-base font-semibold text-slate-900">
            <span>Total Amount</span>
            <span class="text-xl font-bold text-teal-700">₹89.97</span>
          </div>

          <button type="button" id="checkout-btn"
            class="w-full px-4 py-3 font-medium text-center text-white transition bg-teal-700 rounded-md shadow-sm hover:bg-teal-800">
            Proceed to Checkout
          </button>
        </div>

      </div>

      <!-- EMPTY CART STATE
      <div class="max-w-md p-12 mx-auto my-8 text-center bg-white border rounded-lg border-slate-200">
        <div class="flex items-center justify-center w-16 h-16 mx-auto mb-4 text-slate-300">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </div>
        <h2 class="mb-2 text-xl font-semibold text-slate-800">Your cart is empty</h2>
        <p class="mb-6 text-sm text-slate-500">Looks like you haven't added anything to your cart yet.</p>
        <a href="index.html" class="inline-flex items-center justify-center bg-teal-700 hover:bg-teal-800 text-white font-medium px-6 py-2.5 rounded-md transition text-sm">
          Start Shopping
        </a>
      </div>
      -->

    </div>
  </main>

  <footer class="py-6 mt-auto bg-white border-t border-slate-200">
    <div class="container px-4 mx-auto text-sm text-center text-slate-500">
      <p>©  2026 Store. All rights reserved.</p>
    </div>
  </footer>
 <script src="../js/main.js"></script>
</body>

</html>
